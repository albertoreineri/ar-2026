<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bastione</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { touch-action: none; }
        #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center;
               padding: 8px 14px; background: #000b; color: #fff; font-weight: bold; z-index: 1; }
        #menu { position: fixed; bottom: 10px; left: 10px; z-index: 2; }
        #menu button { padding: 12px 16px; min-height: 48px; font-size: 15px; cursor: pointer; border: 2px solid #555; background: #333; color: #fff; border-radius: 6px; }
        #menu button.attivo { border-color: #f1c40f; }
        #menu-popup { display: none; flex-direction: column; gap: 6px; margin-bottom: 6px; padding: 8px; background: #000d; border-radius: 6px;
                      max-height: calc(100vh - 100px); overflow-y: auto; min-width: 220px; }
        #menu-popup.aperto { display: flex; }
        #menu-popup button { text-align: left; }
        #info { position: fixed; top: var(--hud-h, 52px); left: 10px; min-width: 230px; max-width: calc(100vw - 20px); max-height: calc(100vh - 140px); overflow-y: auto; padding: 10px 12px; background: #000c; color: #fff; font-size: 14px; border-radius: 4px; z-index: 1; line-height: 1.5; }
        #info button { display: block; margin-top: 6px; padding: 6px 10px; cursor: pointer; }
        #comandi-touch { position: fixed; bottom: 10px; right: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
        #comandi-touch button { min-width: 120px; min-height: 52px; font-size: 16px; border: 2px solid #555; background: #333; color: #fff; border-radius: 6px; }
        #comandi-touch button.attivo { border-color: #f1c40f; background: #4a4a2a; }
        #btn-conferma { background: #1e6b34 !important; border-color: #2ecc71 !important; }
        @media (max-width: 700px) {
            #hud { gap: 2px 10px; padding: 6px 8px; font-size: 12px; }
            #r-ondata { flex-basis: 100%; }
            #msg { margin-left: 0; flex-basis: 100%; }
            #info button, #menu button { min-height: 44px; }
        }
        #menu-iniziale { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: 24px 16px; box-sizing: border-box; color: #fff; text-align: center;
                         background: linear-gradient(#1f3d1f, #0e1f12); }
        #menu-iniziale h1 { margin: 16px 0 8px; font-size: 40px; }
        #menu-iniziale h2 { margin: 28px 0 10px; font-size: 20px; color: #f1c40f; }
        .livelli { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        .livello { display: flex; flex-direction: column; gap: 4px; width: 260px; padding: 14px; background: #0006; border: 2px solid #5a8f3c; border-radius: 8px; color: #fff; text-decoration: none; text-align: left; }
        .livello:hover { border-color: #f1c40f; background: #0009; }
        .livello.chiuso { opacity: 0.45; border-color: #555; pointer-events: none; }
        .livello span { color: #f1c40f; font-size: 13px; } .livello small { color: #cde; font-size: 12px; }
        #msg { margin-left: auto; color: #f1c40f; }
    </style>
</head>
<body>
    <div id="hud">
        <span id="r-oro"></span><span id="r-legno"></span><span id="r-pietra"></span><span id="r-ferro"></span><span id="r-pane"></span><span id="r-formaggio"></span><span id="r-pop"></span><span id="r-ondata"></span>
        <span id="msg"></span>
    </div>
    <div id="info" style="display:none"></div>
    <div id="menu"></div>
    <script src="js/config.js"></script>
    <script src="js/partita.js"></script>
    <script src="js/map.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/buildings.js"></script>
    <script src="js/units.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/castello.js"></script>
    <script src="js/musica.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
