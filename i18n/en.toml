other = "The official website of the band born out of love and respect for Dire Straits' music — the DSL Dire Straits Legacy project brings together on stage some of the artists who made the legendary British band's sound unique, alongside musicians of international standing."
[project_alpenzu_meta]
other = "E-commerce · Aosta Valley"
[project_alpenzu_desc]
other = "E-commerce for typical products from the Aosta Valley. Alpenzu was founded in 2001 in Arnad with the goal of promoting the territory through traditional family recipes. The name is inspired by a Walser village above Gressoney, a symbol of authenticity."
[project_fiera_meta]
other = "Event · Multilingual site & B2B platform"
[project_fiera_desc]
other = "The multilingual website of the Cycle Tourism Show, an international trade fair dedicated to bike tourism at Padova Fiere. I built the site and the B2B platform for exhibitors and buyers, and I manage the server."
[project_legambiente_meta]
other = "Environmental association · Development & management"
[project_legambiente_desc]
other = "The website of Legambiente's Cuneo chapter: environmental monitoring, campaigns and local events, from the alpine valleys to the plains. I develop and run the site myself."
[project_drivingchange_meta]
other = "Media · Development & management"
[project_drivingchange_desc]
other = "An editorial platform covering people and policies changing Italy — sustainability, governance and wellbeing, plus a podcast. I develop and run the platform myself."

