[page_servizi_number]
other = "Services"
[page_servizi_title]
other = "Design.<br>Websites.<br>Hosting."
[page_servizi_intro]
other = "Three things usually handled separately, often by different people who don't even talk to each other. I keep them together: the person who designs the site is the same one who builds it, and the same one who, a year later, picks up the phone if something breaks."
[servizi_detail_number]
other = "In detail"
[servizi_detail_statement]
other = "Most of the work is <span class=\"accent-word\">designing and building</span> the site. But launch day isn't the end of it: <span class=\"accent-word\">hosting</span>, backups and security stay on my desk for as long as the site is online."
[servizi_process_number]
other = "How I work"
[servizi_process_title]
other = "Four steps,<br>one person."
[process_1_title]
other = "Listening"
[process_1_desc]
other = "Before proposing anything, I understand what you're actually trying to achieve, and what budget and timeline we're working with."
[process_2_title]
other = "Design & development"
[process_2_desc]
other = "I design the interface and build it — WordPress when that's enough, custom-built when the project calls for it."
[process_3_title]
other = "Launch"
[process_3_desc]
other = "I put the site online and check that everything actually works — speed, technical SEO, forms, mobile — not just that it \"looks fine\"."
[process_4_title]
other = "Maintenance"
[process_4_desc]
other = "From here on I take care of hosting, updates and security, with an annual plan designed so you never have to think about it again."

[page_portfolio_number]
other = "Portfolio"
[page_portfolio_title]
other = "Some things<br>I've built."
[page_portfolio_intro]
other = "Every project below starts with a conversation, not an off-the-shelf quote: I figure out what's actually needed, then we decide together whether WordPress is enough or a custom build makes more sense. And once the site is live, I keep following it — hosting, updates and the small changes that come up over time."

[page_chisono_number]
other = "About"
[page_chisono_title]
other = "Hi, I'm Alberto."
[page_chisono_intro]
other = "I'm not an agency with ten people and a project manager standing between you and me. It's just me, from the first quote to the last backup."
[chisono_p1]
other = "I've been working with the web since 2010. I started in design, moved into development, and ended up handling what happens behind the scenes too."
[chisono_p2]
other = "Over the years I've worked with publishers churning out serious daily traffic, e-commerce for local products, even the official website of a band touring stages across Europe. Different projects, same approach: understand well before building."
[chisono_p3]
other = "Today I run projects directly: from idea to design, from code to server. One person, no handoffs between departments."
[chisono_p4]
other = "I live and work from Dronero, in Valle Maira, but location barely matters: most of the work happens remotely, with calls when needed and quick replies by email or message."
[chisono_p5]
other = "I started handling hosting and security too after seeing too many beautiful sites left to fend for themselves right after launch... expired domains, outdated plugins, sites gone from the web overnight, ongoing vulnerabilities. I'd rather stick around and manage everything myself, not just deliver and walk away."
